name: Build WinShield for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Logic tests (detection, integrity, backup/restore, accounts)
        working-directory: windows-app/tests/WinShield.Verify
        run: dotnet run -c Release

      - name: Publish single-file WinShield.exe (no .NET install needed)
        working-directory: windows-app
        run: >
          dotnet publish WinShield.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o ../dist

      - name: Publish the SMALL build (needs the free .NET 8 Desktop Runtime)
        working-directory: windows-app
        run: >
          dotnet publish WinShield.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o ../dist-small

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item README.md dist-small/README.md
          Compress-Archive -Path dist/* -DestinationPath WinShield-win-x64.zip
          Compress-Archive -Path dist-small/* -DestinationPath WinShield-small-needs-dotnet8.zip

      - name: Build the sandbox ISO (WinShield + test script + installer)
        shell: pwsh
        run: |
          pip install pycdlib --break-system-packages 2>$null; if ($LASTEXITCODE) { pip install pycdlib }
          Copy-Item dist/WinShield.exe tools/iso/WinShield.exe
          Copy-Item tools/WinShield-Test.ps1 tools/iso/WinShield-Test.ps1
          @'
          import pycdlib, os
          d = "tools/iso"
          files = [("WinShield.exe","WINSHIELD.EXE"),("WinShield-Test.ps1","WINSHIELD_TEST.PS1"),
                   ("Install-WinShield.cmd","INSTALL_WINSHIELD.CMD"),("WinShield-Sandbox.wsb","WINSHIELD_SANDBOX.WSB"),
                   ("README.txt","README.TXT")]
          iso = pycdlib.PyCdlib()
          iso.new(interchange_level=3, joliet=3, vol_ident="WINSHIELD")
          for real, short in files:
              iso.add_file(os.path.join(d, real), "/" + short + ";1", joliet_path="/" + real)
          iso.write("WinShield-Sandbox.iso"); iso.close()
          print("ISO bytes:", os.path.getsize("WinShield-Sandbox.iso"))
          '@ | Set-Content -Path make_iso.py
          python make_iso.py

      - uses: actions/upload-artifact@v4
        with:
          name: WinShield-win-x64
          path: |
            WinShield-win-x64.zip
            WinShield-small-needs-dotnet8.zip
            WinShield-Sandbox.iso

      - name: Publish a release (downloadable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: WinShield ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          files: |
            WinShield-win-x64.zip
            WinShield-small-needs-dotnet8.zip
            WinShield-Sandbox.iso
