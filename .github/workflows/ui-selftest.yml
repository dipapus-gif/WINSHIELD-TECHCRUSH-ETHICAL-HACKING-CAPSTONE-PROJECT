name: UI self-test (screenshots)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Open every screen in dark and light mode
        working-directory: windows-app
        run: dotnet run -c Release -- --ui-selftest ../ui-shots
        continue-on-error: true
      - name: Show the log
        if: always()
        shell: pwsh
        run: if (Test-Path ui-shots/selftest.log) { Get-Content ui-shots/selftest.log } else { "no log produced" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots
      - name: Publish screenshots to the ui-previews branch (so they can be reviewed)
        if: always()
        shell: pwsh
        run: |
          git config user.name "winshield-ci"; git config user.email "ci@users.noreply.github.com"
          Copy-Item -Recurse ui-shots $env:RUNNER_TEMP\shots
          git checkout --orphan ui-previews
          git rm -rf . | Out-Null
          Copy-Item -Recurse $env:RUNNER_TEMP\shots\* .
          git add -A
          git commit -m "UI screenshots for ${{ github.sha }}"
          git push -f origin ui-previews
