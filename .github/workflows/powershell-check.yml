name: PowerShell scripts parse check

on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/powershell-check.yml']
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 (syntax errors fail the build)
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path tools -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $bad++; "FAIL $($_.FullName)"; $errors | ForEach-Object { "  line $($_.Extent.StartLineNumber): $($_.Message)" } }
            else { "ok   $($_.FullName)" }
          }
          if ($bad) { exit 1 }
      - name: Extract the PowerShell from the one-file Lab and parse it
        shell: pwsh
        run: |
          $t = [IO.File]::ReadAllText("tools/WinShield-Lab.bat")
          $i = $t.IndexOf('##PS1-START##')
          if ($i -lt 0) { throw 'marker missing' }
          $ps = $t.Substring($t.IndexOf([char]10, $i) + 1)
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($ps, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "Lab script parses OK ($($ps.Length) chars)"
          Set-Content -Path $env:TEMP\lab.ps1 -Value $ps
          cmd /c "echo @echo off& echo rem x" | Out-Null
